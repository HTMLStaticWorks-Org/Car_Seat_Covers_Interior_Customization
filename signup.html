<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signup — CAVALON Automotive Interiors</title>
  <meta name="description" content="Create your CAVALON client account to save custom car interior builds and request priority studio consultations." />
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/pages.css" />
</head>
<body>
  <main class="auth-page">
    <div class="auth-top-controls">
      <button type="button" class="icon-toggle-btn" id="rtl-toggle-btn" aria-label="Toggle RTL / LTR Layout" title="Toggle RTL / LTR">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="16 3 20 7 16 11"/><line x1="4" y1="7" x2="20" y2="7"/><polyline points="8 13 4 17 8 21"/><line x1="20" y1="17" x2="4" y2="17"/></svg>
      </button>
      <button type="button" class="icon-toggle-btn" id="theme-toggle-btn" aria-label="Toggle Light/Dark Mode"><span class="theme-icon-slot"></span></button>
    </div>

    <div class="auth-card hero-reveal-1" style="max-width: 500px;">
      <div class="auth-card-brand">
        <a href="index.html" class="brand-lockup" aria-label="CAVALON Home">
          <svg class="brand-logo-mark" viewBox="0 0 64 64" fill="none" aria-hidden="true">
            <rect width="64" height="64" rx="14" fill="#0D1017" stroke="#E58E58" stroke-width="1.8"/>
            <polygon points="32,10 51,21 51,43 32,54 13,43 13,21" stroke="#E58E58" stroke-width="2.2" fill="none"/>
            <path d="M40.5 24C38.2 21.5 35.1 20.2 31.6 20.2C25 20.2 20.2 25.2 20.2 32C20.2 38.8 25 43.8 31.6 43.8C35.1 43.8 38.2 42.5 40.5 40" stroke="#F3F5F8" stroke-width="3" stroke-linecap="round"/>
            <path d="M32 25.5L37.5 32L32 38.5L26.5 32L32 25.5Z" fill="#E58E58"/>
          </svg>
          <span class="brand-wordmark">CAVALON</span>
        </a>
      </div>

      <h1 style="font-family: var(--font-display); font-size: 1.6rem; text-align: center; margin-bottom: 6px;">Create Your Account</h1>
      <p style="text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 22px;">Join the CAVALON bespoke cabin club</p>

      <form id="signup-form" novalidate style="display: grid; gap: 12px;">
        <div class="form-group">
          <label class="form-label" for="s-name">Full Name</label>
          <input type="text" id="s-name" class="form-control" placeholder="e.g. Aarav Sharma" required />
          <span class="form-error" id="err-s-name"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="s-email">Email Address</label>
          <input type="email" id="s-email" class="form-control" placeholder="you@example.com" required />
          <span class="form-error" id="err-s-email"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="s-phone">Phone Number</label>
          <input type="tel" id="s-phone" class="form-control" placeholder="+91 98450 12345" required />
          <span class="form-error" id="err-s-phone"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="s-pass">Password</label>
          <div class="password-wrap">
            <input type="password" id="s-pass" class="form-control" placeholder="Minimum 8 characters" required />
            <button type="button" class="eye-toggle-btn" data-toggle-pw="s-pass" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <span class="form-error" id="err-s-pass"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="s-confirm">Confirm Password</label>
          <div class="password-wrap">
            <input type="password" id="s-confirm" class="form-control" placeholder="Re-enter password" required />
            <button type="button" class="eye-toggle-btn" data-toggle-pw="s-confirm" aria-label="Toggle confirm password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <span class="form-error" id="err-s-confirm"></span>
        </div>

        <div class="form-group">
          <label style="display: inline-flex; align-items: center; gap: 8px; font-size: 0.86rem; cursor: pointer;">
            <input type="checkbox" id="s-terms" style="accent-color: var(--accent);" />
            <span>I agree to the <a href="contact.html#terms" class="auth-link">Terms &amp; Conditions</a></span>
          </label>
          <span class="form-error" id="err-s-terms"></span>
        </div>

        <div id="signup-feedback" class="form-feedback" role="alert"></div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
      </form>

      <div style="display: flex; align-items: center; gap: 12px; margin-top: 20px; color: var(--text-muted); font-size: 0.82rem;">
        <span style="flex: 1; height: 1px; background: var(--border-color);"></span>
        <span>Or sign up with</span>
        <span style="flex: 1; height: 1px; background: var(--border-color);"></span>
      </div>

      <div class="social-auth-row">
        <button type="button" class="social-auth-icon g-btn" data-social="Google" aria-label="Sign up with Google">
          <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.8C6.2 7.2 8.9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.6l3.7 2.9c2.2-2 3.7-5 3.7-8.7z"/><path fill="#FBBC05" d="M5.3 14.8c-.2-.8-.4-1.8-.4-2.8s.2-2 .4-2.8L1.6 6.4C.6 8.1 0 10 0 12s.6 3.9 1.6 5.6l3.7-2.8z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-2.9l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.1-6.7-5L1.6 16.2C3.5 20.1 7.4 23 12 23z"/></svg>
        </button>
        <button type="button" class="social-auth-icon f-btn" data-social="Facebook" aria-label="Sign up with Facebook">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#1877F2"><path d="M14 13.5h2.5l1-4H14v-2c0-1.03 0-2 2-2h1.5V2.14c-.326-.043-1.557-.14-2.857-.14C11.928 2 10 3.657 10 6.7v2.8H7v4h3V22h4v-8.5z"/></svg>
        </button>
        <button type="button" class="social-auth-icon a-btn" data-social="Apple" aria-label="Sign up with Apple">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16.365 1.43c0 1.14-.493 2.27-1.177 3.08-.744.9-1.99 1.57-2.987 1.57-.12 0-.23-.02-.3-.03-.01-.06-.04-.22-.04-.39 0-1.15.572-2.27 1.206-2.98.804-.94 2.142-1.64 3.248-1.68.03.13.05.28.05.43zm4.565 15.71c-.03.07-.463 1.58-1.518 3.12-.945 1.34-1.94 2.71-3.43 2.71-1.517 0-1.9-.88-3.63-.88-1.698 0-2.302.91-3.67.91-1.377 0-2.332-1.26-3.428-2.8-1.287-1.82-2.323-4.63-2.323-7.28 0-4.28 2.797-6.55 5.552-6.55 1.448 0 2.675.95 3.6.95.865 0 2.222-1.01 3.902-1.01.613 0 2.886.06 4.374 2.19-.13.09-2.383 1.37-2.383 4.19 0 3.26 2.854 4.42 2.955 4.45z"/></svg>
        </button>
      </div>

      <div style="text-align: center; font-size: 0.88rem;">
        <p style="color: var(--text-secondary);">Already Have an Account? <a href="login.html" class="auth-link">Login</a></p>
      </div>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
  <script>
    document.querySelectorAll('[data-toggle-pw]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.getAttribute('data-toggle-pw'));
        input.type = input.type === 'password' ? 'text' : 'password';
      });
    });

    document.querySelectorAll('[data-social]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const fb = document.getElementById('signup-feedback');
        fb.className = 'form-feedback success';
        fb.textContent = `${btn.getAttribute('data-social')} OAuth signup selected (frontend UI ready for backend OAuth integration).`;
      });
    });

    document.getElementById('signup-form').addEventListener('submit', (e) => {
      e.preventDefault();
      let valid = true;
      const setErr = (id, msg) => {
        document.getElementById(id).textContent = msg;
        if (msg) valid = false;
      };

      const name = document.getElementById('s-name').value.trim();
      const email = document.getElementById('s-email').value.trim();
      const phone = document.getElementById('s-phone').value.trim();
      const pass = document.getElementById('s-pass').value;
      const confirm = document.getElementById('s-confirm').value;
      const terms = document.getElementById('s-terms').checked;

      setErr('err-s-name', name.length < 2 ? 'Please enter your full name.' : '');
      setErr('err-s-email', !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) ? 'Enter a valid email address.' : '');
      setErr('err-s-phone', phone.replace(/\D/g, '').length < 8 ? 'Enter a valid phone number.' : '');
      setErr('err-s-pass', pass.length < 8 ? 'Password must be at least 8 characters.' : '');
      setErr('err-s-confirm', confirm !== pass ? 'Passwords do not match.' : '');
      setErr('err-s-terms', !terms ? 'Please accept the Terms & Conditions.' : '');

      const fb = document.getElementById('signup-feedback');
      if (!valid) {
        fb.className = 'form-feedback error';
        fb.textContent = 'Please resolve the highlighted errors above.';
        return;
      }

      fb.className = 'form-feedback success';
      fb.textContent = `Account details for ${name} validated (frontend demo — connect your user registration API to create live accounts).`;
      e.target.reset();
    });
  </script>
</body>
</html>
